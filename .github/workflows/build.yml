name: Build Launcher EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build EXE
        run: |
          pip install customtkinter requests minecraft-launcher-lib pyinstaller
          pyinstaller --noconsole --onefile --collect-all customtkinter launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MilitaryLauncher
          path: dist/launcher.exe
          
